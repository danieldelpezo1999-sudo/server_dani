name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Copiar archivos al VPS (rsync por SSH)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=".git*" --exclude=".github" --exclude="backend/.env" --exclude="venv"
          path: ./
          remote_path: /home/${{ secrets.VPS_USER }}/server_dani/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Instalar dependencias y reiniciar el servicio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/server_dani
            source venv/bin/activate
            pip install -r backend/requirements.txt
            sudo cp -r ~/server_dani/frontend/* /var/www/html/
            sudo systemctl restart todoapp
